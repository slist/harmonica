name: Lint Python

on:
  push:
    paths:
      - '**.py'
      - '.github/workflows/lint.yml'
  pull_request:
    paths:
      - '**.py'
      - '.github/workflows/lint.yml'
  workflow_dispatch:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run ruff
        uses: astral-sh/ruff-action@v3
