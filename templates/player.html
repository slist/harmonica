<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>{{ title }}</title>
{% include "partials/no_cache_and_fonts.html" %}
<style>
{% include "partials/player.css" %}
</style>
<script>
{% include "partials/theme.js" %}
</script>
</head>
<body>
<div id="player-bar">
<div id="player-bar-top">
  {{ prev_btn | safe }}
    <a id="back-link" href="{{ back_href }}">← Retour</a>
    <h1>{{ title }}</h1>
    {{ yt_toggle | safe }}
    {{ yt_html | safe }}
    {{ next_btn | safe }}
    <div class="theme-control">
      <label for="theme-select">Thème</label>
      <select id="theme-select">
        <option value="dark">Sombre</option>
        <option value="light">Clair</option>
      </select>
    </div>
  </div>
  <div id="player-bar-media">
    {{ audio_html | safe }}
  </div>
</div>
{{ pdf_html | safe }}
<script>
// Retour vers la liste d'où l'on vient (index.html ou private.html), pas la page précédente
(function(){
  try{
    var l=sessionStorage.getItem("lastList");
    var dir=function(p){return p.substring(0,p.lastIndexOf("/")+1);};
    if(l&&dir(l)===dir(location.pathname))
      document.getElementById("back-link").href=l.substring(l.lastIndexOf("/")+1);
  }catch(e){}
})();
</script>
{{ audio_script | safe }}
{{ yt_script | safe }}
</body>
</html>
